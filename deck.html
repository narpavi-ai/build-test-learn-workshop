 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build It, Show It — Rapid Prototyping with AI · Edmonton Unlimited</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== Edmonton Unlimited brand (extracted from the reference template) ===== */
  :root{
    --navy:#08005B;        /* deep navy — title & dark slides */
    --purple:#8B4FFB;      /* bright brand purple */
    --purple-deep:#6137B3; /* deep purple */
    --green:#00BA6E;       /* green accent */
    --blue:#008CFF;        /* blue accent */
    --yellow:#FFFF00;      /* yellow — used sparingly */
    --ink:#15123A;         /* body text on light slides */
    --muted:#5b5773;       /* secondary text */
    --paper:#ffffff;
    --paper-soft:#f6f4ff;
    --line:#e7e2fb;
    --head:'Saira', system-ui, sans-serif;       /* squared geometric headings */
    --body:'Poppins', system-ui, sans-serif;      /* humanist body */
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--body);
    background:#0a0838;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Stage: 16:9 scaled to viewport ===== */
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #frame{
    position:relative;
    width:1280px; height:720px;
    transform-origin:center center;
    box-shadow:0 30px 90px rgba(0,0,0,.45);
    overflow:hidden;
    border-radius:6px;
    background:#fff;
  }

  .slide{
    position:absolute; inset:0;
    padding:64px 84px;
    display:none;
    flex-direction:column;
    opacity:0;
    transition:opacity .35s ease;
  }
  .slide.active{display:flex; opacity:1;}

  /* ===== Light vs dark vs divider ===== */
  .slide.light{background:var(--paper); color:var(--ink);}
  .slide.dark{background:var(--navy); color:#fff;}
  .slide.divider{
    background:linear-gradient(135deg,var(--purple) 0%, var(--purple-deep) 100%);
    color:#fff;
    justify-content:center;
  }

  /* ===== Headings & text ===== */
  h1,h2,h3{font-family:var(--head); font-weight:700; line-height:1.04; letter-spacing:-.5px;}
  .slide h1{font-size:58px; font-weight:800;}
  .slide h2{font-size:42px;}
  .eyebrow{
    font-family:var(--head);
    font-weight:700; font-size:15px; letter-spacing:3px; text-transform:uppercase;
    color:var(--purple);
    margin-bottom:16px;
  }
  .dark .eyebrow{color:var(--green);}
  .divider .eyebrow{color:rgba(255,255,255,.85);}
  p{font-size:21px; line-height:1.5; color:var(--muted); max-width:62ch;}
  .dark p{color:rgba(255,255,255,.82);}
  .lead{font-size:25px; color:var(--ink); max-width:60ch;}
  .dark .lead{color:#fff;}
  strong{color:var(--purple-deep); font-weight:600;}
  .dark strong{color:var(--green);}
  .ph{ /* personalize placeholder */
    color:var(--blue); font-weight:600; font-style:normal;
    background:rgba(0,140,255,.10); padding:1px 8px; border-radius:6px;
  }
  .dark .ph{color:#7ec2ff; background:rgba(126,194,255,.14);}

  ul{list-style:none; margin-top:8px;}
  li{
    position:relative; font-size:21px; line-height:1.45; color:var(--muted);
    padding-left:34px; margin:14px 0; max-width:60ch;
  }
  .dark li{color:rgba(255,255,255,.85);}
  li::before{
    content:""; position:absolute; left:0; top:11px;
    width:14px; height:14px; border-radius:4px;
    background:var(--purple); transform:rotate(45deg);
  }
  .dark li::before{background:var(--green);}

  /* ===== Header band (logo + stage chip) ===== */
  .topbar{
    position:absolute; top:34px; left:84px; right:84px;
    display:flex; align-items:center; justify-content:space-between;
    z-index:5;
  }
  .wordmark{display:flex; align-items:center; gap:12px;}
  .logo-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    position:relative; flex:none;
  }
  .logo-mark::after{
    content:""; position:absolute; inset:9px;
    border:2.5px solid rgba(255,255,255,.9); border-radius:4px;
  }
  .dark .logo-mark::after,.divider .logo-mark::after{border-color:rgba(255,255,255,.95);}
  .wordmark span{
    font-family:var(--head); font-weight:700; font-size:13px;
    letter-spacing:2.5px; text-transform:uppercase; color:var(--ink);
  }
  .dark .wordmark span,.divider .wordmark span{color:#fff;}
  .wordmark small{display:block; font-size:9px; letter-spacing:2px; color:var(--purple); font-weight:600;}
  .stage-chip{
    font-family:var(--head); font-weight:700; font-size:12px; letter-spacing:2px;
    text-transform:uppercase;
    padding:7px 14px; border-radius:999px;
    background:var(--paper-soft); color:var(--purple-deep);
    border:1px solid var(--line);
  }
  .dark .stage-chip{background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.18);}
  .divider .stage-chip{background:rgba(255,255,255,.16); color:#fff; border-color:rgba(255,255,255,.28);}

  .slide-body{margin-top:96px; display:flex; flex-direction:column; flex:1; justify-content:center;}
  .slide.title-slide .slide-body,.slide.divider .slide-body{justify-content:center;}

  /* ===== Circuit-trace motif (dark slides) ===== */
  .circuit{position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5;}
  .circuit svg{position:absolute;}
  .c-tr{top:-30px; right:-30px;}
  .c-bl{bottom:-30px; left:-30px;}
  .slide-body, .topbar{z-index:2;}

  /* ===== Divider blobs ===== */
  .blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .blob{position:absolute; border-radius:60px; background:rgba(255,255,255,.08);}
  .blob.b1{width:380px; height:380px; top:-120px; right:-80px; transform:rotate(18deg);}
  .blob.b2{width:280px; height:280px; bottom:-110px; left:60px; transform:rotate(-12deg); background:rgba(255,255,255,.06);}
  .blob.b3{width:160px; height:160px; top:120px; left:-50px; transform:rotate(22deg); background:rgba(255,255,0,.10);}

  /* ===== Cards / grids ===== */
  .cards{display:grid; gap:20px; margin-top:30px;}
  .cards.c2{grid-template-columns:1fr 1fr;}
  .cards.c3{grid-template-columns:repeat(3,1fr);}
  .card{
    background:var(--paper-soft); border:1px solid var(--line);
    border-radius:16px; padding:24px 26px;
  }
  .card h3{font-size:21px; color:var(--navy); margin-bottom:8px;}
  .card p{font-size:16px; margin:0;}
  .dark .card{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14);}
  .dark .card h3{color:#fff;}
  .dark .card p{color:rgba(255,255,255,.78);}
  .card .tag{font-family:var(--head); font-weight:700; font-size:13px; letter-spacing:1px; color:var(--purple); text-transform:uppercase;}

  /* ===== Stats (survey slide) ===== */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:34px;}
  .stat{background:var(--paper-soft); border:1px solid var(--line); border-radius:18px; padding:30px 26px;}
  .stat .num{font-family:var(--head); font-weight:800; font-size:62px; line-height:1; color:var(--purple-deep);}
  .stat .lbl{font-size:16px; color:var(--muted); margin-top:10px; line-height:1.35;}
  .stat.accent .num{color:var(--green);}

  /* ===== Prompt block (spec slide) ===== */
  .prompt-box{
    margin-top:26px; background:var(--navy); color:#ede9ff;
    border-radius:16px; padding:28px 30px; position:relative;
    border:1px solid rgba(255,255,255,.12);
  }
  .prompt-box .label{font-family:var(--head); font-weight:700; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--green); margin-bottom:12px;}
  .prompt-box code{
    font-family:'Poppins',monospace; font-size:18px; line-height:1.55; color:#fff;
    display:block; white-space:normal;
  }
  .prompt-box .accentword{color:var(--yellow);}

  /* ===== Pills / flow ===== */
  .flow{display:flex; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .pill{
    font-family:var(--head); font-weight:700; font-size:17px;
    padding:12px 20px; border-radius:999px; background:var(--paper-soft);
    border:1px solid var(--line); color:var(--navy);
  }
  .pill.on{background:var(--purple); color:#fff; border-color:var(--purple);}
  .arrow{color:var(--purple); font-weight:700; font-size:22px;}
  .dark .pill{background:rgba(255,255,255,.07); color:#fff; border-color:rgba(255,255,255,.16);}

  /* ===== Two-column layout ===== */
  .two-col{display:grid; grid-template-columns:1.05fr .95fr; gap:48px; align-items:center; flex:1;}
  .slot{
    border:2px dashed var(--blue); border-radius:18px;
    background:rgba(0,140,255,.05);
    display:flex; align-items:center; justify-content:center;
    color:var(--blue); font-weight:600; font-size:16px; text-align:center; padding:20px;
    min-height:300px;
  }
  .dark .slot{border-color:#7ec2ff; color:#7ec2ff; background:rgba(126,194,255,.07);}

  /* ===== Title slide specifics ===== */
  .title-slide h1{font-size:74px; line-height:1; margin-bottom:22px;}
  .title-kicker{font-family:var(--head); font-weight:700; font-size:18px; letter-spacing:3px; text-transform:uppercase; color:var(--green); margin-bottom:26px;}
  .title-meta{margin-top:40px; font-size:20px; color:rgba(255,255,255,.78);}
  .title-meta b{color:#fff; font-weight:600;}

  /* ===== Divider type ===== */
  .divider h1{font-size:66px; max-width:20ch;}
  .divider .num-badge{
    font-family:var(--head); font-weight:800; font-size:20px;
    width:64px; height:64px; border-radius:18px;
    background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center;
    margin-bottom:24px;
  }

  /* ===== Demo-night timeline ===== */
  .timeline{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-top:36px;}
  .tl{background:var(--paper-soft); border:1px solid var(--line); border-radius:14px; padding:18px 16px; text-align:center;}
  .tl .t{font-family:var(--head); font-weight:800; font-size:24px; color:var(--purple-deep);}
  .tl .n{font-size:14px; color:var(--ink); font-weight:600; margin-top:8px;}
  .tl .d{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.3;}

  /* ===== Resources / recap ===== */
  .reslist li{font-size:19px;}
  .reslist li::before{background:var(--green);}

  /* ===== Footer / progress ===== */
  .footer{
    position:absolute; bottom:26px; left:84px; right:84px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    font-family:var(--head); font-weight:600; color:var(--muted); z-index:5;
  }
  .dark .footer,.divider .footer{color:rgba(255,255,255,.6);}
  .progress{
    position:absolute; bottom:0; left:0; height:4px;
    background:var(--purple); transition:width .35s ease; z-index:6;
  }
  .divider .progress{background:var(--yellow);}

  /* ===== Help hint ===== */
  #hint{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    font-family:var(--head); font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:rgba(255,255,255,.45); z-index:50;
  }
  .note{font-size:16px; color:var(--muted); margin-top:18px; font-style:italic;}
  .dark .note{color:rgba(255,255,255,.65);}

  /* ===== Icons ===== */
  .ic{width:1em; height:1em; flex:none; vertical-align:-.14em; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}

  /* Big stage icon badge above the heading */
  .stage-icon{
    width:74px; height:74px; border-radius:20px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--purple-deep));
    color:#fff; font-size:38px; margin-bottom:22px;
    box-shadow:0 12px 30px rgba(139,79,251,.32);
  }
  .stage-icon.green{background:linear-gradient(135deg,var(--green),#04935a); box-shadow:0 12px 30px rgba(0,186,110,.30);}
  .stage-icon.blue{background:linear-gradient(135deg,var(--blue),#0a5fd0); box-shadow:0 12px 30px rgba(0,140,255,.30);}
  .dark .stage-icon{box-shadow:0 12px 30px rgba(0,0,0,.4);}

  /* Icon chip inside card tags */
  .card .tag{display:inline-flex; align-items:center; gap:7px;}
  .card .tag .ic{font-size:16px;}

  /* Icon circle inside cards (alt) */
  .card-ic{
    width:46px; height:46px; border-radius:13px; font-size:24px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(139,79,251,.10); color:var(--purple-deep); margin-bottom:14px;
  }
  .dark .card-ic{background:rgba(0,186,110,.16); color:#7df0bd;}

  /* Icons inside flow pills */
  .pill{display:inline-flex; align-items:center; gap:9px;}
  .pill .ic{font-size:18px; opacity:.9;}

  /* Icon next to eyebrow */
  .eyebrow{display:inline-flex; align-items:center; gap:9px;}
  .eyebrow .ic{font-size:16px;}

  /* Stat icon */
  .stat .stat-ic{font-size:26px; color:var(--purple); margin-bottom:6px; display:block;}
  .stat.accent .stat-ic{color:var(--green);}

  /* Timeline icon */
  .tl .tl-ic{font-size:20px; color:var(--purple-deep); display:block; margin-bottom:6px;}
  .num-badge .ic{font-size:32px;}

  /* List icon variant — replace diamond with check on reslist */
  .reslist li{padding-left:32px;}
  .reslist li .ic{position:absolute; left:0; top:3px; font-size:20px; color:var(--green);}
  .reslist li.has-ic::before{display:none;}
</style>
</head>
<body>
<div id="stage"><div id="frame"><!-- slides injected --></div></div>
<div id="hint">← → arrows / space to navigate · F fullscreen</div>

<script>
/* ============================================================
   Reusable chrome
============================================================ */
const wordmark = (dark) => `
  <div class="wordmark">
    <div class="logo-mark" title="Edmonton Unlimited logo placeholder"></div>
    <div><span>Edmonton Unlimited</span><small>Student Founders Launch</small></div>
  </div>`;

const circuit = () => `
  <div class="circuit">
    <svg class="c-tr" width="320" height="220" viewBox="0 0 320 220" fill="none">
      <path d="M320 40 H210 a30 30 0 0 0 -30 30 V150 a30 30 0 0 1 -30 30 H40" stroke="#8B4FFB" stroke-width="2" stroke-linecap="round"/>
      <path d="M320 100 H260 a20 20 0 0 0 -20 20 V180" stroke="#00BA6E" stroke-width="2" stroke-linecap="round"/>
      <circle cx="180" cy="70" r="5" fill="#00BA6E"/><circle cx="40" cy="180" r="5" fill="#8B4FFB"/>
    </svg>
    <svg class="c-bl" width="320" height="220" viewBox="0 0 320 220" fill="none">
      <path d="M0 180 H110 a30 30 0 0 0 30 -30 V70 a30 30 0 0 1 30 -30 H280" stroke="#8B4FFB" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 120 H60 a20 20 0 0 0 20 -20 V40" stroke="#008CFF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="140" cy="150" r="5" fill="#008CFF"/>
    </svg>
  </div>`;

const blobs = () => `<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>`;

/* ---- Inline SVG icon library (stroke, currentColor) ---- */
const ICONS = {
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l.9-5.4A8 8 0 1 1 21 12Z"/><path d="M8 11h8M8 14h5"/>',
  scissors:'<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.1 7.6 20 18M8.1 16.4 20 6"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',

  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/>',
  rocket:'<path d="M5 15c-2 1-2 5-2 5s4 0 5-2M9 13l-2 2M11 15l-2 2"/><path d="M14.5 9.5 19 5c1-1 1-3 0-3s-3 0-4 1l-3.5 4.5"/><path d="M9 13s-1-4 2-7 7-2 7-2 1 4-2 7-7 2-7 2Z"/><circle cx="14.5" cy="9.5" r="1.3"/>',
  scale:'<path d="M3 17l5-9 5 9M3 17h10M8 8V4"/><path d="M16 13l3-5 3 5M16 13h6"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/>',
  code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 6l-4 12"/>',
  chart:'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-7"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3Z"/>',
  wifi:'<path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0M11 18.5a2 2 0 0 1 2 0"/><circle cx="12" cy="20" r=".6" fill="currentColor" stroke="none"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  check:'<path d="m20 6-11 11-5-5"/>',
  checkc:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.3 2.3 4.7-4.6"/>',
  heart:'<path d="M12 20s-7-4.5-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.5-9.2 9-9.2 9Z"/>',
  terminal:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>',
  github:'<path d="M9 19c-4 1.4-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.3 1.8 5.3 2.1 5.3 2.1a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 8.5c0 4.6 2.7 5.7 5.5 6-.4.4-.5.9-.5 1.7V21"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 3 2 3H5"/>',
  scope:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h18"/><circle cx="15" cy="15" r="2.2"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor" stroke="none"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',

  arrowr:'<path d="M5 12h14M13 6l6 6-6 6"/>',

  hand:'<path d="M7 11V6a1.5 1.5 0 0 1 3 0v4M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V6a1.5 1.5 0 0 1 3 0v6c0 4-2.5 8-6 8s-6-3-6-6v-1l-1-2a1.4 1.4 0 0 1 2.3-1.6L7 12"/>'
};
const ic = (name) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||''}</svg>`;

/* ============================================================
   Slides
============================================================ */
const slides = [

/* 1 — TITLE */
`<section class="slide dark title-slide" data-chip="Welcome">
  ${circuit()}
  <div class="topbar">${wordmark(true)}<div class="stage-chip">Demo Night Prep</div></div>
  <div class="slide-body">
    <div class="title-kicker">Student Founders Launch · Demo Night Prep</div>
    <h1>Build It, Show It<br/>Rapid Prototyping with AI</h1>

/* ============================================================
   Engine: render, navigate, scale, fullscreen
============================================================ */
const frame = document.getElementById('frame');
frame.innerHTML = slides.join('') + '<div class="progress" id="prog"></div>';
const nodes = [...frame.querySelectorAll('.slide')];
const prog = document.getElementById('prog');
let i = 0;

function show(n){
  i = Math.max(0, Math.min(slides.length-1, n));
  nodes.forEach((s,idx)=>s.classList.toggle('active', idx===i));
  prog.style.width = ((i+1)/slides.length*100) + '%';
  location.hash = i+1;
}
function next(){ show(i+1); }
function prev(){ show(i-1); }

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ show(0); }
  else if(e.key==='End'){ show(slides.length-1); }
  else if(e.key==='f'||e.key==='F'){ toggleFs(); }
});
// click right half = next, left half = prev
frame.addEventListener('click', e=>{
  const x = e.clientX - frame.getBoundingClientRect().left;
  (x > frame.clientWidth/2) ? next() : prev();
});

function toggleFs(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
  else { document.exitFullscreen?.(); }
}

// scale 1280x720 to fit viewport, preserving 16:9
function fit(){
  const pad = 0;
  const sx = (window.innerWidth - pad) / 1280;
  const sy = (window.innerHeight - pad) / 720;
  frame.style.transform = 'scale(' + Math.min(sx, sy) + ')';
}
window.addEventListener('resize', fit);
fit();

// open to hash slide if present
const start = parseInt(location.hash.replace('#',''),10);
show(Number.isFinite(start) && start>0 ? start-1 : 0);
</script>
